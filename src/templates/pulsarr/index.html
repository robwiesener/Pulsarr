<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>
        {% block title %}Pulsarr{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/static/css/pulsarr.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <img
                src="/static/img/logo.svg"
                alt="Pulsarr"
                class="logo">
        </div>

        <nav class="menu">

            <a href="/library" class="{% if request.path == '/library' %}active{% endif %}">
                <i class="bi bi-book"></i>
                <span>Library</span>
            </a>

            <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-bookshelf"></i>
                <span>Wishlist</span>
            </a>

            <a href="/result-management" class="{% if request.path == '/result-management' %}active{% endif %}">
                <i class="bi bi-download"></i>
                <span>Result Management</span>
            </a>

            <a href="/activity-log" class="{% if request.path == '/activity-log' %}active{% endif %}">
                <i class="bi bi-journal-text"></i>
                <span>Activity Log</span>
            </a>

            <a href="/configuration" class="{% if request.path == '/configuration' %}active{% endif %}">
                <i class="bi bi-gear"></i>
                <span>Configuration</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            <div class="version">
                v0.8.9
            </div>

        </div>

    </aside>

    <button
        type="button"
        class="mobile-menu-toggle"
        aria-label="Open menu"
        aria-expanded="false">
        <i class="bi bi-list"></i>
        <img
            src="/static/img/logo.svg"
            alt="Pulsarr"
            class="mobile-menu-logo">

        <span class="mobile-page-title">
            {% if request.path == "/" %}
                Wishlist
            {% elif request.path == "/library" %}
                Library
            {% elif request.path == "/result-management" %}
                Result Management
            {% elif request.path == "/activity-log" %}
                Activity Log
            {% elif request.path == "/configuration" %}
                Configuration
            {% else %}
                Pulsarr
            {% endif %}
        </span>
    </button>

    <div class="mobile-menu-overlay"></div>

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

<script>

const sidebar = document.querySelector(".sidebar");
const menuToggle = document.querySelector(".mobile-menu-toggle");
const menuOverlay = document.querySelector(".mobile-menu-overlay");

function openMobileMenu() {
    sidebar.classList.add("mobile-open");
    menuOverlay.classList.add("mobile-open");
    menuToggle.setAttribute("aria-expanded", "true");
}

function closeMobileMenu() {
    sidebar.classList.remove("mobile-open");
    menuOverlay.classList.remove("mobile-open");
    menuToggle.setAttribute("aria-expanded", "false");
}

menuToggle.addEventListener("click", function () {
    if (sidebar.classList.contains("mobile-open")) {
        closeMobileMenu();
    } else {
        openMobileMenu();
    }
});

menuOverlay.addEventListener("click", closeMobileMenu);


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
